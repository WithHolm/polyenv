name: Pull Request Labeler

on:
- pull_request_target

permissions:
    contents: read
    pull-requests: write

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/labeler@v5